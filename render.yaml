services:
  # Backend: FastAPI
  - type: web
    name: bot-dni-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && gunicorn main:app -w 1 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_SESSION_STRING
        sync: false
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TARGET_BOT_USERNAME
        value: "@SectaData_Bot"

  # Frontend: Static Site (Vite)
  - type: web
    name: bot-dni-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "frontend/dist"
    envVars:
      - key: VITE_API_URL
        value: "https://bot-dni-backend.onrender.com" # Cambia esto por tu URL de Render una vez desplegado
